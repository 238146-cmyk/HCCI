    background-position:center 40%;
    background-repeat:no-repeat;
  }

  .bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    background:
      linear-gradient(180deg,
        rgba(18,13,7,0.12) 0%,
        rgba(20,14,8,0.05) 22%,
        rgba(20,14,8,0.20) 55%,
        rgba(14,10,5,0.55) 100%);
  }

  /* ---------- crenellation divider (echoes the mosque parapet + logo gear teeth) ---------- */
  .crenel{
    width:min(320px, 60vw);
    height:14px;
    margin:0 auto;
    display:block;
    opacity:0.85;
  }
  .crenel path{ fill: var(--gold-soft); }

  /* ---------- logo ---------- */
  .logo-wrap{
    position:relative;
    width:132px;
    height:132px;
    margin-bottom:22px;
    animation: rise 900ms ease-out both;
  }
  .logo-ring{
    position:absolute;
    inset:-10px;
    border-radius:22px;
    background:radial-gradient(circle at 50% 40%, rgba(201,154,62,0.35), rgba(201,154,62,0) 70%);
  }
  .logo-plate{
    width:100%;
    height:100%;
    border-radius:18px;
    background: radial-gradient(circle at 35% 30%, #fbf6ea, #ede0c4 70%);
    padding:10px;
    box-shadow:
      0 0 0 1px rgba(201,154,62,0.55),
      0 10px 30px rgba(0,0,0,0.55);
  }
  .logo-plate img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:14px;
  }

  .content-panel{
    max-width:640px;
    padding:30px 34px 34px;
    border-radius:22px;
    background:rgba(18,13,7,0.30);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }

  .eyebrow{
    font-family:'Tajawal',sans-serif;
    font-weight:500;
    letter-spacing:0.12em;
    font-size:13px;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:10px;
    animation: rise 900ms ease-out 80ms both;
  }

  h1{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:clamp(30px, 6vw, 52px);
    line-height:1.25;
    color:var(--cream);
    text-shadow:0 2px 18px rgba(0,0,0,0.5);
    margin-bottom:6px;
    animation: rise 900ms ease-out 160ms both;
  }

  h2{
    font-family:'Tajawal',sans-serif;
    font-weight:400;
    font-size:clamp(16px, 2.6vw, 20px);
    color:var(--gold-soft);
    margin-bottom:22px;
    animation: rise 900ms ease-out 220ms both;
  }

  .lede{
    max-width:560px;
    font-size:clamp(14.5px, 1.8vw, 17px);
    line-height:2;
    color:var(--cream-dim);
    margin:0 auto 30px;
    animation: rise 900ms ease-out 300ms both;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 40px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#221a0d;
    font-family:'Tajawal',sans-serif;
    font-weight:800;
    font-size:16px;
    text-decoration:none;
    border:none;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 12px 28px rgba(201,154,62,0.32), inset 0 1px 0 rgba(255,255,255,0.5);
    transition:transform 220ms ease, box-shadow 220ms ease;
    animation: rise 900ms ease-out 380ms both;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 34px rgba(201,154,62,0.42), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .cta:active{ transform:translateY(0); }
  .cta svg{ width:18px; height:18px; transform:scaleX(-1); }

  .foot{
    position:absolute;
    bottom:22px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:0.08em;
    color:rgba(244,236,219,0.55);
    animation: fade 1200ms ease-out 600ms both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fade{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:480px){
    .logo-wrap{ width:104px; height:104px; }
    .foot{ bottom:16px; }
  }
</style>
</head>
